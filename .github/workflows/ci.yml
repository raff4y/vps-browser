name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint setup.sh
        run: shellcheck setup.sh

      - name: Build a test .env
        run: |
          HASH=$(docker run --rm caddy:2 caddy hash-password --plaintext ci-test-password)
          sed "s|^AUTH_HASH=.*|AUTH_HASH='$HASH'|" .env.example > .env

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Validate docker-compose.coolify.yml
        run: docker compose -f docker-compose.coolify.yml config -q

      - name: Browser container must not publish any ports
        run: |
          for f in docker-compose.yml docker-compose.coolify.yml; do
            docker compose -f "$f" config --format json \
              | jq -e '.services.browser.ports == null' > /dev/null \
              || { echo "$f: the browser service publishes a port, which bypasses the login."; exit 1; }
          done

      - name: Coolify stack must not publish any host ports
        run: |
          docker compose -f docker-compose.coolify.yml config --format json \
            | jq -e '[.services[].ports] | all(. == null)' > /dev/null \
            || { echo "Coolify's proxy owns 80/443; docker-compose.coolify.yml must not publish ports."; exit 1; }

      - name: Validate Caddyfile
        run: |
          set -a; . ./.env; set +a
          docker run --rm \
            -e DOMAIN -e ACME_EMAIL -e AUTH_USER -e AUTH_HASH \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build and validate the Coolify Caddy image
        run: |
          set -a; . ./.env; set +a
          docker build -t vps-browser-caddy-coolify ./coolify
          docker run --rm -e AUTH_USER -e AUTH_HASH vps-browser-caddy-coolify \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
