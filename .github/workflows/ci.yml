name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck -s bash install.sh vps-browser browser/restart-watcher

      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum

      - name: Vet and build the panel
        working-directory: panel
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt"; exit 1; }
          go vet ./...
          go build ./...

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.coolify.yml config -q

      - name: Only Caddy may publish ports
        run: |
          docker compose config --format json \
            | jq -e '.services.browser.ports == null and .services.panel.ports == null' > /dev/null \
            || { echo "browser/panel must not publish ports: that would bypass the sign-in."; exit 1; }

      - name: Coolify stack must not publish any host ports
        run: |
          docker compose -f docker-compose.coolify.yml config --format json \
            | jq -e '[.services[].ports] | all(. == null)' > /dev/null \
            || { echo "Coolify's proxy owns 80/443; docker-compose.coolify.yml must not publish ports."; exit 1; }

      - name: Validate Caddyfiles
        run: |
          for mode in acme internal; do
            docker run --rm -e TLS_MODE=$mode -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile
          done
          docker build -t vps-browser-caddy-coolify ./coolify
          docker run --rm vps-browser-caddy-coolify caddy validate --config /etc/caddy/Caddyfile

      - name: Build images
        run: docker compose build
