# vps-browser: a private Chromium browser on your server, behind HTTPS and a
# sign-in page. Install with install.sh, then finish setup in your browser.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # HTTPS + routing. The only service that's reachable from the internet.
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - panel
      - browser
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      - TLS_MODE=${TLS_MODE:-acme}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # HTTPS certificates
      - caddy-config:/config
    networks:
      - edge
      - control

  # Setup wizard, sign-in page, dashboard, and the auth check for the browser.
  panel:
    build: ./panel
    image: vps-browser-panel:local
    restart: unless-stopped
    logging: *logging
    environment:
      - TLS_MODE=${TLS_MODE:-acme}
      - PUBLIC_IP=${PUBLIC_IP:-}
    volumes:
      - panel-data:/data                 # settings, password hash
      - browser-policies:/policies       # start page -> Chromium
      - browser-control:/control         # restart requests -> browser
    networks:
      - control

  # Full Chromium desktop, streamed to your own browser as a web page.
  # Never give this service `ports:` - that would skip the sign-in.
  browser:
    build: ./browser
    image: vps-browser-chromium:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      - panel                  # panel creates the shared volumes with the right owner
    shm_size: "2gb"            # Chromium crashes on video-heavy sites without this
    security_opt:
      - seccomp:unconfined     # required by Chromium's sandbox inside Docker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - TITLE=VPS Browser
      - RESTART_APP=true       # bring Chromium back if it crashes or is closed
    volumes:
      # Bookmarks, history and logins. A named volume (not a host folder)
      # because the desktop needs Unix sockets in /config, which Windows/macOS
      # bind mounts can't hold.
      - browser-data:/config
      - browser-policies:/etc/chromium/policies/recommended:ro
      - browser-control:/vps-browser:ro
    networks:
      - edge

# The browser can't reach the panel: it's only on "edge", the panel only on
# "control", and Caddy sits between them.
networks:
  edge:
  control:

volumes:
  browser-data:
    name: vps-browser-data
  panel-data:
    name: vps-browser-panel
  browser-policies:
  browser-control:
  caddy-data:
    name: vps-browser-certs
  caddy-config:
